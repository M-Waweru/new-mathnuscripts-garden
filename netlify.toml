[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10.9.2"

[[redirects]]
  from = "/"
  to = "/content/home"
  status = 301

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
