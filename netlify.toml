[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10.9.2"

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/:section/:slug"
  to = "/:section/:slug.html"
  status = 200

[[redirects]]
  from = "/:section/:subsection/:slug"
  to = "/:section/:subsection/:slug.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
