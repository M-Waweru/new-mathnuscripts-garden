[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10.9.2"

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/:section/:slug"
  to = "/:section/:slug.html"
  status = 200

[[redirects]]
  from = "/:section/:subsection/:slug"
  to = "/:section/:subsection/:slug.html"
  status = 200

[[redirects]]
  from = "/content/*"
  to = "/content/:splat.html"
  status = 200

[[redirects]]
  from = "/fleeting-notes/*"
  to = "/fleeting-notes/:splat.html"
  status = 200

[[redirects]]
  from = "/deep-research/*"
  to = "/deep-research/:splat.html"
  status = 200

[[redirects]]
  from = "/introspection/*"
  to = "/introspection/:splat.html"
  status = 200

[[redirects]]
  from = "/areas/*"
  to = "/areas/:splat.html"
  status = 200

[[redirects]]
  from = "/poems/*"
  to = "/poems/:splat.html"
  status = 200

[[redirects]]
  from = "/clippings/*"
  to = "/clippings/:splat.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
