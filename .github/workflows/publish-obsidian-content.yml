name: Publish Obsidian Content

on:
  workflow_dispatch:
  repository_dispatch:
    types: [obsidian-pushed]

concurrency:
  group: publish-obsidian-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mathnuscripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Obsidian knowledge base
        uses: actions/checkout@v4
        with:
          repository: M-Waweru/obsidian-knowledge-base
          ref: ${{ github.event.client_payload.source_ref || 'play-with-cursor' }}
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          path: .source/obsidian
          fetch-depth: 1

      - name: Import allowlisted published content
        run: node scripts/import-obsidian-content.mjs --source .source/obsidian

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site
        run: npm run check

      - name: Build Quartz
        run: npm run build

      - name: Commit imported content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/Content/Essays" "content/Content/Mathnuscripts"
          if git diff --cached --quiet; then
            echo "No imported content changes."
          else
            git commit -m "chore: sync published content from Obsidian"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
