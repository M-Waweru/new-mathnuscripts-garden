# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Mathnuscripts
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: mathnuscripts.netlify.app
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Newsreader
      body: Source Serif 4
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f8f6f0"
        lightgray: "#e4ded2"
        gray: "#9b9488"
        darkgray: "#403c36"
        dark: "#201e1a"
        secondary: "#8a3f2d"
        tertiary: "#315f52"
        highlight: rgba(138, 63, 45, 0.11)
        textHighlight: "#d7bd4a55"
      darkMode:
        light: "#191816"
        lightgray: "#312e29"
        gray: "#766f64"
        darkgray: "#d6d0c4"
        dark: "#f4efe5"
        secondary: "#d68b72"
        tertiary: "#87b5a4"
        highlight: rgba(214, 139, 114, 0.12)
        textHighlight: "#8f762d88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 3
      minEntries: 2
      showByDefault: true
      collapseByDefault: false
      layout: modern
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: selfHosted
      header: Newsreader
      body: Source Serif 4
      code: IBM Plex Mono
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Browse
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true
    layout:
      position: afterBody
      priority: 20
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      showReadingTime: true
      showComma: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Mathenge Waweru: https://mwaweru.com
        RSS: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
